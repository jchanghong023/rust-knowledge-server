name: Release CentOS 7

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and package for glibc 2.17
        run: |
          # Run Actions on Ubuntu; only the build runs in the older userspace.
          docker run --rm --volume "$PWD:/work" --workdir /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:8a79ff36ce155d8f242dc8013d73c5e8bbe937defb15de7d7afb342c1ab537f4 \
            bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs |
                sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.98.1
              export PATH="$HOME/.cargo/bin:/opt/python/cp311-cp311/bin:$PATH"
              bash release/build-centos7.sh
              bin_dir=target/x86_64-unknown-linux-gnu/release
              LD_BIND_NOW=1 "$bin_dir/rust-knowledge-server" --help
              tar -czf rust-knowledge-server-centos7-x86_64.tar.gz -C "$bin_dir" rust-knowledge-server
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: centos7-x86_64
          path: rust-knowledge-server-centos7-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: centos7-x86_64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes rust-knowledge-server-centos7-x86_64.tar.gz
